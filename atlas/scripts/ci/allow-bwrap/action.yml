#
# Ubuntu 24.04 runners confine unprivileged user namespaces with AppArmor, so
# bubblewrap cannot configure the sandbox's loopback ("Failed RTM_NEWADDR:
# Operation not permitted"). The generated-code isolation tests need the same
# bwrap a fleet host runs; Debian hosts allow it by default.
#
# Every job that runs tests uses this after installing bubblewrap: atlas.yml and
# the sync-omp candidate check. It lives under atlas/ because .github/actions/*
# are omp base files.
name: Allow unprivileged user namespaces for bubblewrap
description: Lift the AppArmor user-namespace restriction and prove bwrap can build a sandbox.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        bwrap --unshare-all --die-with-parent --ro-bind / / true
