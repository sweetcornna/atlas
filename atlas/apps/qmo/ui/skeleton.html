<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="app.css">
</head>
<!--
  What the main window shows while `qmo` opens a session and the hub's page
  loads: the front's frame as the hub's page last laid it out (qmo-local.md
  §3.5) — the side panel as wide as it was, or closed; the Work | Code control
  with the last face lit; as many rows and group headings as it showed; the
  page and side panel colours it reported — so the hub's page paints over the
  same shapes instead of a blank window. The script at the end draws that
  from the shell's plan before the first paint; what is written here is the
  frame before any page has reported one.
-->
<body>
<div class="drag" data-tauri-drag-region></div>
<div class="skeleton" aria-hidden="true">
  <div class="skeleton-side">
    <div class="skeleton-modes"><span class="skeleton-mode" data-mode="work">Work</span><span class="skeleton-mode" data-mode="code">Code</span></div>
    <div class="skeleton-list">
      <div class="skeleton-row label"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row short"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row label"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row short"></div>
    </div>
  </div>
  <div class="skeleton-main"></div>
</div>
<script src="skeleton.js"></script>
</body>
</html>
