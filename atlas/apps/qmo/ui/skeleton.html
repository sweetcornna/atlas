<!--
  What the main window shows while `qmo` opens a session and the hub's page
  loads: the front's frame (a 288 px side list and an empty column) in the
  front's colours, so the hub's page paints over the same shapes instead of
  a blank window.
-->
<body>
<div class="drag" data-tauri-drag-region></div>
<div class="skeleton" aria-hidden="true">
  <div class="skeleton-side">
    <div class="skeleton-row short"></div>
    <div class="skeleton-row"></div>
    <div class="skeleton-row label"></div>
    <div class="skeleton-row"></div>
    <div class="skeleton-row"></div>
    <div class="skeleton-row short"></div>
    <div class="skeleton-row"></div>
    <div class="skeleton-row label"></div>
    <div class="skeleton-row"></div>
    <div class="skeleton-row short"></div>
  </div>
  <div class="skeleton-main"></div>
</div>
</body>
</html>
