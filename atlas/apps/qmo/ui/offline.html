<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="app.css">
<script type="module" src="offline.js"></script>
</head>
<body class="loading">
<div class="drag" data-tauri-drag-region></div>
<main class="offline">
  <span id="mark"></span>
  <h1 id="title"></h1>
  <p id="note"></p>
  <p id="detail" class="detail selectable"></p>
  <div class="actions">
    <button class="btn btn-primary" id="retry" type="button" data-i18n="offline.retry"></button>
    <button class="btn btn-secondary" id="browser" type="button" data-i18n="offline.browser" hidden></button>
    <button class="btn btn-ghost btn-danger" id="signout" type="button" data-i18n="offline.signout" hidden></button>
  </div>
  <p id="next" class="note" role="status"></p>
</main>
</body>
</html>
