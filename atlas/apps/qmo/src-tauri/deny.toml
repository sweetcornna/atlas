# The desktop shell is its own Cargo workspace, so the root deny.toml does not
# reach it. Same licence policy as the root; run with
#   cargo deny --manifest-path atlas/apps/qmo/src-tauri/Cargo.toml \
#     check --config atlas/apps/qmo/src-tauri/deny.toml licenses

[licenses]
version = 2
include-dev = true
include-build = true
unused-allowed-license = "allow"
unused-license-exception = "deny"
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
# MPL-2.0 is file-level copyleft, satisfied by upstream source availability;
# nothing attaches to our unmodified use. Package-scoped like the root's
# uluru: tauri-utils reads HTML through dom_query → selectors/cssparser, and
# dirs-sys pulls option-ext.
exceptions = [
    { allow = ["AGPL-3.0-or-later"], crate = "qmo-app" },
    { allow = ["MPL-2.0"], crate = "cssparser@0.37.0" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros@0.7.1" },
    { allow = ["MPL-2.0"], crate = "dtoa-short@0.3.5" },
    { allow = ["MPL-2.0"], crate = "option-ext@0.2.0" },
    { allow = ["MPL-2.0"], crate = "selectors@0.38.0" },
]
