# Inputs of THIRD-PARTY-NOTICES.txt for the desktop shell, which is a Cargo
# workspace of its own (the root about.toml does not reach it). Same licence
# policy as deny.toml here and the root's about.toml; regenerate with
#   cd atlas/apps/qmo/src-tauri
#   cargo about generate --locked --config about.toml about.hbs -o THIRD-PARTY-NOTICES.txt
# `OR` expressions resolve in the order below, so a permissive branch wins
# where one exists.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
]

# Only what ships in the app; the build and dev tooling stays out of the notice.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The shell itself is first-party (AGPL-3.0-or-later, publish = false).
private = { ignore = true }

# MPL-2.0 is file-level copyleft, satisfied by upstream source availability and
# attached package by package, as in deny.toml.
[cssparser]
accepted = ["MPL-2.0"]

[cssparser-macros]
accepted = ["MPL-2.0"]

[dtoa-short]
accepted = ["MPL-2.0"]

[option-ext]
accepted = ["MPL-2.0"]

[selectors]
accepted = ["MPL-2.0"]
