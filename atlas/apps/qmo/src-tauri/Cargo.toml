# The Qmo desktop shell (docs/dev/qmo-app.md). A Cargo workspace of its own:
# the empty table below keeps it out of the omp workspace at the repo root.
[workspace]

[package]
name = "qmo-app"
version = "0.1.0"
description = "阡陌 Qmo desktop shell"
authors = ["Qianmo AgentNest Team"]
license = "AGPL-3.0-or-later"
edition = "2021"
publish = false

[lib]
name = "qmo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
cookie = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
